name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # No model weights are distributed with this repository, so the runner has
      # none. Tests that need real ONNX inference skip themselves; everything
      # else - parsers, MRZ check digits, mask semantics, barcode decoding,
      # response contracts and the synthetic catalog fixtures - runs here.
      - name: Test
        run: pytest -rs

      - name: Assert the asset-dependent tests really did skip
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path("assets").exists(), "model weights must never be committed"
          PY

  fixtures:
    name: Fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Rebuild the synthetic test catalog
        run: python tools/generate_test_catalog.py
      - name: The committed catalog must match the generator
        run: git diff --exit-code -- tests/fixtures/catalog

  no-real-data:
    name: No vendor material or real personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan for vendor names and known real identifiers
        run: |
          set +e
          # Word-boundaried so e.g. "regula" doesn't match "regular"/"Regular.ttf".
          # NOTICE/CONTRIBUTING.md legitimately name these vendors (attribution,
          # an explicit history note); this file (ci.yml) is excluded by name
          # because it contains the search pattern itself as literal text and
          # would otherwise always match its own source line.
          grep -rniE '\bregula\b|\brecpass\b|\blibocr\b|\brecognito\b|id r&d|\bidlive\b|\bfaceonlive\b|\bdnnocr\b|\bdnniq\b|\bdnn_docdetect\b|\blibttvcore\b|\blibmetachecker\b|\blibrecognition\b|\blibliveness\b' \
            --exclude-dir=.git --exclude=NOTICE --exclude=CONTRIBUTING.md --exclude=ci.yml .
          if [ $? -eq 0 ]; then
            echo "::error::vendor-derived reference found"
            exit 1
          fi
          exit 0

      # The grep above only catches vendor names. This is the actual guarantee
      # from NOTICE: every sample image must be a generated, clearly-fake
      # fixture, never a real document or photo — enforced by filename
      # convention, not by pattern-matching for specific real values (which
      # would mean committing those values into this file).
      - name: Assert every sample image is a synthetic fixture
        run: |
          status=0
          shopt -s nullglob
          for f in examples/samples/*; do
            base="$(basename "$f")"
            case "$base" in
              synthetic_*) ;;
              *)
                echo "::error file=$f::sample file is not prefixed 'synthetic_' - real document/photo fixtures must never be committed"
                status=1
                ;;
            esac
          done
          exit $status

  docker:
    name: Docker image builds and starts with no models mounted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t identity-analysis-runtime:ci .

      - name: Start container (no assets volume mounted)
        run: docker run -d --name iar -p 8000:8000 identity-analysis-runtime:ci

      - name: Wait for /v1/capabilities and confirm every feature is unavailable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/v1/capabilities -o /tmp/caps.json; then break; fi
            sleep 1
          done
          cat /tmp/caps.json
          python - <<'PY'
          import json
          caps = json.load(open("/tmp/caps.json"))
          # Shape check only: without a mounted asset directory, this must start
          # cleanly and report itself as unable to run inference, not crash.
          assert isinstance(caps, dict), "capabilities response must be a JSON object"
          PY

      - name: Container logs
        if: always()
        run: docker logs iar || true

      - name: Stop container
        if: always()
        run: docker rm -f iar || true
